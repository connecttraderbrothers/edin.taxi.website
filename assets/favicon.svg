<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8a020"/>
      <stop offset="50%" stop-color="#d4881a"/>
      <stop offset="100%" stop-color="#c87018"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Taxi body -->
  <g transform="translate(256,280)" fill="#1a1a1a">
    <!-- Main body -->
    <ellipse cx="0" cy="0" rx="155" ry="105"/>
    <!-- Roof -->
    <path d="M-95,-60 L-70,-130 L70,-130 L95,-60 Z"/>
    <!-- Left mirror -->
    <ellipse cx="-150" cy="-30" rx="22" ry="14"/>
    <!-- Right mirror -->
    <ellipse cx="150" cy="-30" rx="22" ry="14"/>
    <!-- Left headlight -->
    <ellipse cx="-80" cy="-10" rx="35" ry="18" fill="url(#bg)"/>
    <!-- Right headlight -->
    <ellipse cx="80" cy="-10" rx="35" ry="18" fill="url(#bg)"/>
    <!-- Left wheel area -->
    <rect x="-140" y="60" width="55" height="60" rx="5"/>
    <!-- Right wheel area -->
    <rect x="85" y="60" width="55" height="60" rx="5"/>
    <!-- Taxi sign -->
    <rect x="-50" y="-165" width="100" height="40" rx="10" fill="#1a1a1a"/>
  </g>
  <!-- TAXI text -->
  <text x="256" y="155" text-anchor="middle" fill="#d4881a" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="28" letter-spacing="3">TAXI</text>
</svg>
